<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SentinelGrid SOC — Enterprise Security Operations Center with real-time threat monitoring, AI-powered analysis, MITRE ATT&CK mapping, and compliance management." />
    <meta name="theme-color" content="#0b1120" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <title>SentinelGrid SOC — MITRE · NIST · VirusTotal · Windows Logs</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Service Worker: only register in production, unregister in dev
      if ('serviceWorker' in navigator) {
        if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
          // DEV: Unregister all service workers to prevent stale cache
          navigator.serviceWorker.getRegistrations().then(regs => {
            regs.forEach(r => r.unregister());
            if (regs.length > 0) {
              console.warn('[SW] Unregistered', regs.length, 'service worker(s) in dev mode. Reloading...');
              caches.keys().then(names => Promise.all(names.map(n => caches.delete(n)))).then(() => location.reload());
            }
          });
        } else {
          // PRODUCTION: register normally
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
              .then(reg => console.log('[SW] Registered:', reg.scope))
              .catch(err => console.warn('[SW] Registration failed:', err));
          });
        }
      }
    </script>
  </body>
</html>
