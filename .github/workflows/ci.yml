# SentinelForge CI — typecheck, test, build the Turborepo packages.
# (The legacy SentinelGrid Vite app has its own scripts at the repo root.)
#
# Install notes (learned the hard way):
# - Plain `npm install` at the root covers all workspaces; bare
#   `npm install --workspaces` behaves inconsistently across npm majors.
# - Do NOT `npm --prefix apps/web install`. npm treats that as a standalone
#   project and drops react/react-dom/next into apps/web/node_modules — exactly
#   the duplicate tree apps/web/scripts/check-deps.js rejects, because the app
#   then resolves its own React instead of the hoisted one. One React version
#   (19.2.3) runs across the repo, so the root install is the whole story.
name: sentinelforge-ci
on:
  push:
    # Round 29: the root manifests join the filter. The blocking audit gate
    # reads the ROOT package-lock.json, yet a lockfile-only fix (removing an
    # unused prod dependency after a new advisory) silently skipped CI — no
    # run was created and the fix was never verified by the pipeline it was
    # written for. Any change to the dependency graph must run the gate.
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci.yml'
  pull_request:
    # The workflow file itself is included so a change to CI is exercised by CI.
    paths: ['apps/**', 'packages/**', 'package.json', 'package-lock.json', '.github/workflows/ci.yml']

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: node apps/web/scripts/check-deps.js
      # Build the library packages BEFORE any typecheck: dist/ is git-ignored,
      # and these npm --prefix steps bypass turbo (whose `dependsOn: ["^build"]`
      # would normally order this). Verified 2026-11-17 by reproducing the CI
      # failure on a dist-less tree: apps/api typecheck cannot resolve
      # @sentinelforge/{workers,mcp-servers,graph-service} until their dist
      # exists. Order matters: mcp-servers imports workers + graph-service,
      # and the api imports all three (types AND runtime — tests run the app
      # in-process).
      - run: npm --prefix apps/workers run build
      - run: npm --prefix packages/graph-service run build
      - run: npm --prefix packages/mcp-servers run build
      - run: npm --prefix apps/api run typecheck
      - run: npm --prefix apps/workers run typecheck
      - run: npm --prefix packages/graph-service run typecheck
      - run: npm --prefix packages/mcp-servers run typecheck
      - run: npm --prefix apps/web run typecheck
      - run: npm --prefix apps/workers run test
      - run: npm --prefix packages/graph-service run test
      - run: npm --prefix packages/mcp-servers run test
      # Deliberately also in the api-tests job below: this one is the merge gate
      # that blocks on every step, the other gives the API + embedded-Postgres
      # path its own named signal. Both must stay green.
      - run: npm --prefix apps/api run test
      - run: npm --prefix apps/api run build
      - run: npm --prefix apps/web run build
      # Dependency hygiene gate — production dependencies must be free of
      # high/critical advisories. Dev-only tooling is reported separately
      # (see SECURITY.md: Vite 7 advisory belongs to the legacy SentinelGrid
      # dev server, which is not shipped).
      - name: audit (production deps, blocking)
        run: npm audit --workspaces --omit=dev --audit-level=high
      - name: secret scan (no committed credentials)
        run: |
          ! git grep -nIE "(ghp_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----)" \
            -- . ':!*.lock' ':!SECURITY.md' ':!apps/workers/tests/*' ':!apps/api/tests/*'

  # The API suite includes the Postgres integration tests (stale-boot settlement
  # after an API restart, concurrent analysis reconciliation). Those need a real
  # database; apps/api/tests/pgHarness.ts boots a throwaway embedded PostgreSQL in
  # the runner's temp directory and removes it afterwards, so this job needs no
  # `services:` container, no database secret, and no setup step.
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      # apps/api imports the built workspace packages at runtime (the tests run the
      # app in-process), so their dist/ must exist before the suite starts. Same
      # manual ordering as `verify` — see the note there for why not turbo.
      - run: npm --prefix apps/workers run build
      - run: npm --prefix packages/graph-service run build
      - run: npm --prefix packages/mcp-servers run build
      # `test` = vitest run over apps/api/tests, Postgres file included. It fails
      # loudly if the embedded cluster cannot start, rather than skipping.
      - name: API suite (embedded Postgres integration included)
        run: npm --prefix apps/api run test
